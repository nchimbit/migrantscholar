name: Expand thin posts
on:
  workflow_dispatch:
jobs:
  expand:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install groq-sdk
      - name: Expand thin posts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node --input-type=module << 'EOF'
          import { readFileSync, writeFileSync, readdirSync } from 'fs';
          import { join, dirname } from 'path';
          import { fileURLToPath } from 'url';
          import Groq from 'groq-sdk';

          const client = new Groq({ apiKey: process.env.GROQ_API_KEY });
          const postsDir = 'content/posts';
          const files = readdirSync(postsDir).filter(f => f.endsWith('.mdx'));
          
          let expanded = 0;
          const MAX_EXPAND = 10;

          for (const file of files) {
            if (expanded >= MAX_EXPAND) break;
            const fpath = join(postsDir, file);
            const content = readFileSync(fpath, 'utf8');
            const parts = content.split('---');
            if (parts.length < 3) continue;
            const fm = parts[1];
            const body = parts.slice(2).join('---').trim();
            const words = body.split(/\s+/).length;
            if (words >= 900) continue;

            const titleMatch = fm.match(/title: "([^"]+)"/);
            const countryMatch = fm.match(/country: "([^"]+)"/);
            if (!titleMatch) continue;

            console.log(`Expanding: ${file} (${words} words)`);
            
            try {
              const response = await client.chat.completions.create({
                model: "llama3-70b-8192",
                max_tokens: 2000,
                messages: [{
                  role: "user",
                  content: `You are expanding a scholarship article for MigrantScholar.com. Keep all existing content and ADD more detail to reach 1500+ words total. Add more to: Who Qualifies section, Application Steps, Required Documents checklist, and FAQ section. Only use verified information. Never invent scholarship details.\n\nCountry: ${countryMatch?.[1]||''}\nTitle: ${titleMatch[1]}\n\nExisting content:\n${body}\n\nReturn the complete expanded markdown only. No backticks. No code fences.`
                }]
              });
              
              const expandedContent = response.choices[0]?.message?.content;
              if (!expandedContent) { console.log('Empty response, skipping'); continue; }
              if (expandedContent.split(/\s+/).length <= words) { console.log('Not expanded enough, skipping'); continue; }
              
              writeFileSync(fpath, '---' + fm + '---\n' + expandedContent.trim() + '\n');
              console.log(`Expanded: ${file} to ${expandedContent.split(/\s+/).length} words`);
              expanded++;
            } catch(e) {
              console.log(`Failed: ${file} - ${e.message}`);
            }
          }
          console.log(`Done: expanded ${expanded} posts`);
          EOF
      - name: Commit
        run: |
          git config --global user.name "MigrantScholar Bot"
          git config --global user.email "bot@migrantscholar.com"
          git add content/posts/
          git diff --staged --quiet || git commit -m "fix: expand thin posts to 1500+ words"
          git push
