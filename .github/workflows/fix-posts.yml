name: Fix old posts
on:
  workflow_dispatch:
jobs:
  fix-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fix all post issues
        run: |
          node << 'FIXEOF'
          const fs = require('fs');
          const path = require('path');

          const TODAY = new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
          const SITE = "https://migrantscholar.com";
          const postsDir = path.join(__dirname, 'content/posts');
          
          // Get all files sorted by name (older files first)
          const files = fs.readdirSync(postsDir).filter(f => f.endsWith('.mdx')).sort();
          
          let deleted = 0;
          let fixed = 0;

          // STEP 1: Delete duplicates (keep oldest, delete newer duplicates)
          const slugsSeen = {};
          const specificDuplicates = [
            "2026-06-29-turkish-scholarships-australia.mdx",
            "2026-06-30-australia-awards-scholarships.mdx",
            "2026-07-03-turkey-government-scholarships.mdx",
            "2026-07-08-daad-scholarships-for-refugees.mdx",
            "2026-07-09-australia-awards-refugee-scholarships.mdx",
            "2026-07-09-australia-awards-scholarships.mdx",
            "2026-07-09-uk-refugee-scholarships.mdx",
            "2026-07-09-usa-migrant-scholarships.mdx",
            "2026-07-10-usa-scholarships-for-refugees.mdx",
            "2026-07-21-germany-emergency-funding-asylum-seekers.mdx",
            "2026-07-23-uk-stem-scholarships-asylum-seekers.mdx",
            "2026-07-25-germany-stem-scholarships-syrian-refugees.mdx",
            "2026-07-27-usa-stem-scholarships-afghan-refugees.mdx",
            "2026-07-29-afghan-women-stem-scholarships-australia.mdx",
          ];

          for (const file of specificDuplicates) {
            const fpath = path.join(postsDir, file);
            if (fs.existsSync(fpath)) {
              fs.unlinkSync(fpath);
              console.log('Deleted duplicate:', file);
              deleted++;
            }
          }

          // STEP 2: Fix remaining posts
          const remainingFiles = fs.readdirSync(postsDir).filter(f => f.endsWith('.mdx'));

          for (const file of remainingFiles) {
            const fpath = path.join(postsDir, file);
            let content = fs.readFileSync(fpath, 'utf8');
            const parts = content.split('---');
            if (parts.length < 3) continue;
            
            let frontmatter = parts[1];
            let body = parts.slice(2).join('---').trim();
            const originalBody = body;
            const originalFm = frontmatter;

            // Fix "Introduction to" - multiple patterns
            body = body.replace(/^Introduction to [^\n]+\n+/gm, '');
            body = body.replace(/^# Introduction to [^\n]+\n+/gm, '');
            body = body.replace(/^## Introduction to [^\n]+\n+/gm, '');

            // Remove DEADLINE/FUNDING lines
            body = body.replace(/^DEADLINE:.*$/mg, '');
            body = body.replace(/^FUNDING:.*$/mg, '');

            // Fix ALL vercel URLs
            body = body.replace(/https?:\/\/migrantscholar\.vercel\.app/g, SITE);
            body = body.replace(/migrantscholar\.vercel\.app/g, 'migrantscholar.com');
            frontmatter = frontmatter.replace(/https?:\/\/migrantscholar\.vercel\.app/g, SITE);
            frontmatter = frontmatter.replace(/migrantscholar\.vercel\.app/g, 'migrantscholar.com');

            // Add Last Reviewed if missing
            if (!body.includes('Last Reviewed:')) {
              body = body.trimEnd() + '\n\n---\n*Last Reviewed: ' + TODAY + '*\n';
            }

            // Add Related Guides if missing
            if (!body.includes('Related Guides')) {
              const countryMatch = frontmatter.match(/country: "([^"]+)"/);
              const country = countryMatch ? countryMatch[1] : '';
              const countryLink = country ? 
                `[${country} scholarships for migrants](${SITE}/countries/${country})` : 
                `[All scholarships](${SITE}/blog)`;
              body = body.trimEnd() + `\n\n## Related Guides\n- ${countryLink}\n- [Fully funded scholarships](${SITE}/by-funding/fully-funded)\n- [Scholarships for refugees](${SITE}/by-eligibility/refugees)\n- [Scholarship deadlines 2026](${SITE}/deadlines)\n`;
            }

            // Add lastReviewed to frontmatter if missing
            if (!frontmatter.includes('lastReviewed:')) {
              frontmatter = frontmatter.trimEnd() + '\nlastReviewed: "' + TODAY + '"\n';
            }

            // Fix excerpt - remove URLs and Introduction to
            frontmatter = frontmatter.replace(
              /excerpt: "([^"]*)"/,
              (match, excerpt) => {
                let cleaned = excerpt
                  .replace(/Introduction to [^.]+\./g, '')
                  .replace(/\(https?:\/\/[^\)]+\)/g, '')
                  .replace(/https?:\/\/[^\s"]+/g, '')
                  .replace(/migrantscholar\.vercel\.app/g, 'migrantscholar.com')
                  .replace(/\s+/g, ' ')
                  .trim();
                return `excerpt: "${cleaned}"`;
              }
            );

            // Fix metaDescription too
            frontmatter = frontmatter.replace(
              /metaDescription: "([^"]*)"/,
              (match, meta) => {
                let cleaned = meta
                  .replace(/Introduction to [^.]+\./g, '')
                  .replace(/\(https?:\/\/[^\)]+\)/g, '')
                  .replace(/https?:\/\/[^\s"]+/g, '')
                  .replace(/migrantscholar\.vercel\.app/g, 'migrantscholar.com')
                  .replace(/\s+/g, ' ')
                  .trim();
                return `metaDescription: "${cleaned}"`;
              }
            );

            body = body.trim();

            if (body !== originalBody || frontmatter !== originalFm) {
              fs.writeFileSync(fpath, '---' + frontmatter + '---\n' + body + '\n');
              fixed++;
            }
          }

          console.log('=== FIX COMPLETE ===');
          console.log('Deleted duplicates:', deleted);
          console.log('Fixed posts:', fixed);
          console.log('Remaining posts:', remainingFiles.length);
          FIXEOF

      - name: Commit fixes
        run: |
          git config --global user.name "MigrantScholar Bot"
          git config --global user.email "bot@migrantscholar.com"
          git add content/posts/
          git diff --staged --quiet || git commit -m "fix: delete 14 duplicates, fix vercel URLs, Introduction to, Last Reviewed"
          git push
