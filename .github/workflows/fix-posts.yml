name: Fix old posts
on:
  workflow_dispatch:
jobs:
  fix-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fix all post issues
        run: |
          node << 'FIXEOF'
          const fs = require('fs');
          const path = require('path');

          const TODAY = new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
          const SITE = "https://migrantscholar.com";
          const postsDir = path.join(__dirname, 'content/posts');
          const files = fs.readdirSync(postsDir).filter(f => f.endsWith('.mdx')).sort();
          
          let fixed = 0;
          let deleted = 0;

          // 1. Delete duplicate posts (keep older, delete newer)
          const slugsSeen = {};
          const toDelete = [];
          
          for (const file of files) {
            const fpath = path.join(postsDir, file);
            const content = fs.readFileSync(fpath, 'utf8');
            const parts = content.split('---');
            if (parts.length < 3) continue;
            const frontmatter = parts[1];
            const slugMatch = frontmatter.match(/slug: "([^"]+)"/);
            if (slugMatch) {
              const slug = slugMatch[1];
              if (slugsSeen[slug]) {
                toDelete.push(file); // delete the newer duplicate
              } else {
                slugsSeen[slug] = file;
              }
            }
          }

          for (const file of toDelete) {
            fs.unlinkSync(path.join(postsDir, file));
            console.log('Deleted duplicate:', file);
            deleted++;
          }

          // 2. Fix remaining posts
          const remainingFiles = fs.readdirSync(postsDir).filter(f => f.endsWith('.mdx'));

          for (const file of remainingFiles) {
            const fpath = path.join(postsDir, file);
            let content = fs.readFileSync(fpath, 'utf8');
            const parts = content.split('---');
            if (parts.length < 3) continue;
            
            let frontmatter = parts[1];
            let body = parts.slice(2).join('---').trim();
            const originalBody = body;
            const originalFm = frontmatter;

            // Remove "Introduction to"
            body = body.replace(/^Introduction to [^\n]+\n+/m, '');
            body = body.replace(/^# Introduction to [^\n]+\n+/m, '');

            // Remove standalone first heading
            body = body.replace(/^#{1,2} [^\n]+\n+/, '');

            // Remove DEADLINE/FUNDING lines
            body = body.replace(/^DEADLINE:.*$/mg, '');
            body = body.replace(/^FUNDING:.*$/mg, '');

            // Fix vercel URLs
            body = body.replace(/migrantscholar\.vercel\.app/g, 'migrantscholar.com');
            frontmatter = frontmatter.replace(/migrantscholar\.vercel\.app/g, 'migrantscholar.com');

            // Add Last Reviewed if missing
            if (!body.includes('Last Reviewed:')) {
              body = body.trimEnd() + '\n\n---\n*Last Reviewed: ' + TODAY + '*\n';
            }

            // Add Related Guides if missing
            if (!body.includes('## Related Guides') && !body.includes('Related Guides')) {
              const countryMatch = frontmatter.match(/country: "([^"]+)"/);
              const country = countryMatch ? countryMatch[1] : '';
              const countryLink = country ? `[${country} scholarships for migrants](${SITE}/countries/${country})` : `[All scholarships](${SITE}/blog)`;
              body = body.trimEnd() + `\n\n## Related Guides\n- ${countryLink}\n- [Fully funded scholarships](${SITE}/by-funding/fully-funded)\n- [Scholarships for refugees](${SITE}/by-eligibility/refugees)\n- [Scholarship deadlines 2026](${SITE}/deadlines)\n`;
            }

            // Add lastReviewed to frontmatter if missing
            if (!frontmatter.includes('lastReviewed:')) {
              frontmatter = frontmatter.trimEnd() + '\nlastReviewed: "' + TODAY + '"\n';
            }

            // Fix excerpt
            frontmatter = frontmatter.replace(
              /excerpt: "([^"]*)"/,
              (match, excerpt) => {
                let fixed = excerpt
                  .replace(/Introduction to [^.]+\./g, '')
                  .replace(/\(https?:\/\/[^\)]+\)/g, '')
                  .replace(/https?:\/\/[^\s]+/g, '')
                  .replace(/\s+/g, ' ')
                  .trim();
                return `excerpt: "${fixed}"`;
              }
            );

            body = body.trim();

            if (body !== originalBody || frontmatter !== originalFm) {
              fs.writeFileSync(fpath, '---' + frontmatter + '---\n' + body + '\n');
              fixed++;
            }
          }

          console.log('Deleted duplicates:', deleted);
          console.log('Fixed posts:', fixed);
          console.log('Remaining posts:', remainingFiles.length - deleted);
          FIXEOF

      - name: Commit fixes
        run: |
          git config --global user.name "MigrantScholar Bot"
          git config --global user.email "bot@migrantscholar.com"
          git add content/posts/
          git diff --staged --quiet || git commit -m "fix: delete 14 duplicates, fix vercel URLs, Last Reviewed, Introduction to"
          git push
